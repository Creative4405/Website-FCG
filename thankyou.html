<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You | Future Creative Group</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root {
  --teal: #3a8ea8;
  --teal-light: #5ab0cb;
  --dark: #111520;
  --mid: #1a1f2e;
  --gray: #8a9ab5;
  --white: #ffffff;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--dark);
  color: var(--white);
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  overflow: hidden;
}

/* Background effect */
.bg {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 20% 80%, rgba(58,142,168,0.15), transparent 60%),
    radial-gradient(circle at 80% 20%, rgba(58,142,168,0.15), transparent 60%);
}

/* Card */
.container {
  position: relative;
  z-index: 1;
  max-width: 600px;
  width: 90%;
  background: linear-gradient(135deg, var(--mid), rgba(58,142,168,0.08));
  border: 1px solid rgba(58,142,168,0.2);
  border-radius: 20px;
  padding: 3rem 2rem;
  text-align: center;
  backdrop-filter: blur(12px);
  animation: fadeUp .8s ease;
}

/* Logo */
.logo img {
  width: 120px;
  margin-bottom: 1.5rem;
}

/* Check icon */
.check {
  width: 70px;
  height: 70px;
  border-radius: 50%;
  border: 2px solid var(--teal);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 1.5rem;
  font-size: 2rem;
  color: var(--teal-light);
}

/* Heading */
h1 {
  font-family: 'Syne', sans-serif;
  font-size: 2.5rem;
  margin-bottom: 1rem;
}

/* Subtext */
.sub {
  color: var(--teal-light);
  letter-spacing: .1em;
  font-size: .85rem;
  margin-bottom: 1.5rem;
}

/* Paragraph */
p {
  color: var(--gray);
  line-height: 1.7;
  font-size: .95rem;
}

/* Button */
.btn {
  display: inline-block;
  margin-top: 2rem;
  padding: 12px 28px;
  border-radius: 8px;
  border: 1px solid var(--teal);
  color: var(--teal-light);
  text-decoration: none;
  font-weight: 600;
  transition: all .3s;
}

.btn:hover {
  background: var(--teal);
  color: #fff;
  transform: translateY(-2px);
  box-shadow: 0 10px 25px rgba(58,142,168,0.3);
}

/* Animation */
@keyframes fadeUp {
  from {opacity: 0; transform: translateY(30px);}
  to {opacity: 1; transform: translateY(0);}
}

/* Mobile */
@media (max-width: 600px) {
  h1 { font-size: 2rem; }
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="container">

  <!-- LOGO -->
  <div class="logo">
    <img src="./logo.png" alt="">
  </div>

  <!-- CHECK ICON -->
  <div class="check">✓</div>

  <!-- TEXT -->
  <h1>Thank You!</h1>
  <div class="sub">MESSAGE SENT SUCCESSFULLY</div>

  <p>
    We appreciate you reaching out to us.  
    Our team will review your message and get back to you as soon as possible.
  </p>

  <!-- BUTTON -->
  <a href="https://futurecreativegroup.co.za" class="btn">
    Back to Home
  </a>

</div>

</body>
</html>
